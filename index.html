<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEAKYCATS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
:root{
  /* Фон */
  --bg:#F4F6F9;
  --bg2:#FFFFFF;

  /* Текст */
  --text:#2A2A2A;
  --text2:#1C1C1C;
  --muted:#A1A1A1;

  /* Неоморф-тени */
  --shadow: 12px 12px 26px rgba(170,180,195,.45), -12px -12px 26px rgba(255,255,255,.92);

  /* “Платина/серебро” */
  --plat1:#D3D9E1;
  --plat2:#B0B7C1;
  --plat3:#FFFFFF;
  --plat4:#A2A9B1;

  /* Высоты */
  --heroH:min(40vh, 380px);
  --heroMin:240px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none}

/* Контейнер под мобилку */
.page{
  width:min(430px,100%);
  margin:0 auto;
  min-height:100dvh;
}

/* ---------- HERO VIDEO ---------- */
.hero{
  position:relative;
  width:100%;
  height:var(--heroH);
  min-height:var(--heroMin);
  overflow:hidden;
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  border-bottom-left-radius:26px;
  border-bottom-right-radius:26px;
  box-shadow:var(--shadow);
}

/* видео */
.heroVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}

/* мягкая дымка поверх */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(900px 360px at 30% 18%, rgba(255,255,255,.62), rgba(255,255,255,0) 62%),
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.06));
  pointer-events:none;
}

/* MENU BUTTON (как в твоём коде по виду, но по цветам серый неоморф) */
.menuBtn{
  position:absolute;
  top:14px;
  right:14px;
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(244,246,249,.72);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  z-index:5;
  transition:transform .14s ease, filter .14s ease;
}
.menuBtn svg{width:22px;height:22px;color:rgba(28,28,28,.92)}
.menuBtn:active{transform:scale(.96);filter:brightness(.98)}

/* БАННЕР поверх HERO справа сверху (появится если есть banner.*) */
.heroBanner{
  position:absolute;
  top:14px;
  right:70px;
  height:46px;
  width:min(56%,230px);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  z-index:5;
  display:block;
}
.heroBannerImg{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.heroBanner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
  pointer-events:none;
}

/* ---------- CONTENT ---------- */
.wrap{
  padding:18px 16px 28px;
}

/* Заголовок — жирнее + перелив (как в твоём, но платиновый) */
.h1{
  text-align:center;
  font-size:clamp(30px,7vw,44px);
  font-weight:900;
  letter-spacing:1.2px;
  color:transparent;
  background:linear-gradient(90deg,
    #1c1c1c,
    #7f8a99,
    #1c1c1c,
    #b7c0cc,
    #1c1c1c
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:metalFlow 10s linear infinite;
  text-shadow:0 12px 26px rgba(0,0,0,.06);
}
@keyframes metalFlow{to{background-position:220% 50%}}

.lead{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

/* ---------- WORK BANNER (кнопка) ---------- */
.workBanner{
  position:relative;
  margin-top:18px;
  height:120px;
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  display:block;
}
.workVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}
.workBanner::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(800px 280px at 20% 55%, rgba(255,255,255,.42), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.10));
  pointer-events:none;
}
.workTitle{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:900;
  letter-spacing:1px;
  color:transparent;
  background:linear-gradient(90deg,
    var(--plat3),
    #cfd6df,
    var(--plat3),
    #aeb7c3,
    var(--plat3)
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:metalFlow 10s linear infinite;
  text-shadow:0 12px 26px rgba(0,0,0,.12);
}

/* ---------- PLATINUM BUTTONS (перелив) ---------- */
.grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.metalBtn{
  position:relative;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  letter-spacing:.6px;
  color:var(--text2);

  /* платиново-серебряный градиент */
  background:
    linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,0) 38%),
    linear-gradient(120deg,
      #aeb7c3,
      var(--plat1),
      #e8edf5,
      var(--plat3),
      var(--plat2),
      #e8edf5,
      #aeb7c3
    );

  box-shadow:var(--shadow);
  overflow:hidden;
  user-select:none;
  transition:transform .15s ease, filter .15s ease;
}

/* shimmer как в твоём коде */
.metalBtn::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:linear-gradient(115deg,
    transparent 40%,
    rgba(255,255,255,.55) 50%,
    transparent 60%
  );
  transform:translateX(-50%) rotate(12deg);
  animation:shimmer 3s linear infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}
@keyframes shimmer{to{transform:translateX(50%) rotate(12deg)}}

.metalBtn:active{
  transform:translateY(1px) scale(.98);
  filter:brightness(.985);
}

/* ---------- MENU SHEET ---------- */
.sheetWrap{
  position:fixed;
  inset:0;
  display:none;
  z-index:1000;
}
.sheetWrap.active{display:block}
.sheetShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
}
.sheet{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(86vw,340px);
  background:rgba(244,246,249,.92);
  padding:18px;
  transform:translateX(100%);
  transition:transform .22s ease-out;
  box-shadow:-18px 0 38px rgba(0,0,0,.18);
  border-top-left-radius:22px;
  border-bottom-left-radius:22px;
}
.sheetWrap.active .sheet{transform:none}
.sheet h2{
  color:var(--text2);
  font-weight:900;
  margin:8px 0 14px;
}
.sheet a{
  display:block;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  margin-bottom:12px;
  box-shadow:var(--shadow);
  color:var(--text2);
  font-weight:800;
}
.sheet a:active{transform:translateY(1px)}

/* footer */
.foot{
  margin-top:18px;
  text-align:center;
  font-size:12px;
  color:rgba(161,161,161,.95);
}
.foot a{
  color:rgba(42,42,42,.9);
  font-weight:900;
  text-decoration:none;
  border-bottom:1px dashed rgba(180,188,202,.95);
}

/* лёгкий hover только на ПК */
@media (hover:hover){
  .metalBtn:hover{filter:brightness(.995)}
  .workBanner:hover{transform:translateY(-1px)}
}
</style>
</head>

<body>
<div class="page">

  <!-- HERO -->
  <section class="hero">
    <video
      class="heroVideo"
      id="heroVideo"
      autoplay
      loop
      muted
      playsinline
      preload="metadata"
      poster="hero.jpg"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
    >
      <source src="hero.mp4" type="video/mp4">
    </video>

    <!-- БАННЕР (просто положи banner.png / banner.webp / banner.gif рядом) -->
    <a class="heroBanner" href="#" id="heroBanner" aria-label="Баннер">
      <img class="heroBannerImg" id="heroBannerImg" alt="" />
    </a>

    <button class="menuBtn" id="openMenu" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </section>

  <main class="wrap">
    <div class="h1">PEAKYCATS</div>
    <div class="lead">магазинчик бла бла бла — покупайте больше цифровых товаров</div>

    <!-- WORK -->
    <a class="workBanner" href="jobs.html" aria-label="Работа">
      <video
        class="workVideo"
        id="workVideo"
        autoplay
        loop
        muted
        playsinline
        preload="metadata"
        poster="work.jpg"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      >
        <source src="work.mp4" type="video/mp4">
      </video>
      <div class="workTitle">РАБОТА</div>
    </a>

    <!-- BUTTONS -->
    <section class="grid" aria-label="Кнопки">
      <a class="metalBtn" href="https://t.me/" target="_blank" rel="noopener">КАНАЛ</a>
      <a class="metalBtn" href="#">ЧАТ</a>
      <a class="metalBtn" href="jobs.html">ВАКАНСИИ</a>
      <a class="metalBtn" href="https://t.me/663studio" target="_blank" rel="noopener">СОЗДАТЕЛЬ</a>
      <a class="metalBtn" href="https://t.me/jdjfioa1ucusoangibot" target="_blank" rel="noopener">БОТ</a>
      <a class="metalBtn" href="#">ПОМОЩНИК</a>
    </section>

    <footer class="foot">
      Сделано — <a href="https://t.me/663studio" target="_blank" rel="noopener">твоя ссылка</a>
    </footer>
  </main>

</div>

<!-- MENU -->
<div class="sheetWrap" id="sheet">
  <div class="sheetShade" id="closeSheet"></div>
  <aside class="sheet" role="dialog" aria-label="Меню">
    <h2>Меню</h2>
    <a href="#">Главная</a>
    <a href="jobs.html">Работа</a>
    <a href="#">Контакты</a>
    <a href="jobs.html">Вакансии</a>
  </aside>
</div>

<script>
/* ===== MENU ===== */
const sheet = document.getElementById('sheet');
document.getElementById('openMenu').onclick = () => sheet.classList.add('active');
document.getElementById('closeSheet').onclick = () => sheet.classList.remove('active');
window.addEventListener('keydown', (e) => { if(e.key === 'Escape') sheet.classList.remove('active'); });

/* ===== баннер: попробуем подхватить banner.* без fetch (работает и file://) ===== */
(function(){
  const wrap = document.getElementById('heroBanner');
  const img  = document.getElementById('heroBannerImg');
  const list = ['banner.webp','banner.png','banner.gif','Banner.webp','Banner.png','Banner.gif'];
  let i = 0;

  function tryNext(){
    if(i >= list.length){
      wrap.style.display = 'none';
      return;
    }
    img.src = list[i++] + '?v=' + Date.now();
  }
  img.onload = () => { wrap.style.display = 'block'; };
  img.onerror = () => { tryNext(); };
  tryNext();
})();

/* ===== VIDEO AUTOPLAY HARDENING (iOS/Android/PC) ===== */
const vids = [
  document.getElementById('heroVideo'),
  document.getElementById('workVideo')
].filter(Boolean);

function tryPlay(v){
  if(!v) return;
  v.muted = true;
  v.playsInline = true;
  const p = v.play();
  if(p && typeof p.catch === 'function') p.catch(()=>{});
}

function kickAll(){ vids.forEach(tryPlay); }

/* 1) сразу */
kickAll();
/* 2) после load */
window.addEventListener('load', kickAll);
/* 3) на первый тап/скролл */
['touchstart','pointerdown','click','scroll'].forEach(evt=>{
  window.addEventListener(evt, kickAll, { once:true, passive:true });
});
/* 4) при возврате вкладки */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) kickAll();
});
/* 5) если пауза — поднимем */
vids.forEach(v=>{
  v.addEventListener('pause', ()=>{
    if(!document.hidden) tryPlay(v);
  });
});
</script>

</body>
</html>
