<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PEAKYCATS — неоморфизм</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      /* фон */
      --bg:#F4F6F9;
      --bg2:#FFFFFF;

      /* панели/карточки */
      --panel:#FFFFFF;
      --panel2:#F0F0F0;

      /* текст */
      --text:#2A2A2A;
      --text2:#1C1C1C;
      --muted:#A1A1A1;

      /* неоморф-тени (очень мягкие) */
      --shadow-dark: rgba(170, 178, 190, .55); /* близко к #D1D7E2, но чуть контрастнее */
      --shadow-light: rgba(255,255,255,.92);

      /* серые кнопки (неоморф) */
      --btn1:#D3D9E1;
      --btn2:#B0B7C1;
      --btnActive:#A2A9B1;

      /* золотой градиент для 6 кнопок */
      --gold1:#FFE08A;
      --gold2:#F0B53A;

      /* ассеты */
      --hero-img: none;
      --work-img: none;
      --banner-img: none;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{-webkit-tap-highlight-color:transparent;}
    body{
      font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:linear-gradient(180deg,var(--bg2),var(--bg));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a,button{ -webkit-tap-highlight-color:transparent; outline:none; }

    /* оболочка под мобилку */
    .shell{
      width:min(100vw,430px);
      min-height:100dvh;
      margin:auto;
      border-radius:26px;
      background:linear-gradient(180deg,var(--bg2),var(--bg));
      box-shadow:
        14px 14px 34px rgba(0,0,0,.10),
        -14px -14px 30px rgba(255,255,255,.9);
      overflow:hidden;
      position:relative;
    }
    .content{position:relative; z-index:1;}

    /* прелоадер (мягкий, серый) */
    .loader{
      position:absolute;
      inset:0;
      z-index:99;
      background:linear-gradient(180deg,var(--bg2),var(--bg));
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:opacity .35s ease, visibility .35s ease;
    }
    .loader.hidden{opacity:0; visibility:hidden;}
    .spinner{
      width:18px; height:18px;
      border-radius:999px;
      border:2px solid rgba(160,170,185,.35);
      border-top-color:rgba(70,80,95,.65);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loaderText{font-weight:900; color:var(--text); opacity:.85;}

    /* ===== HERO: полноэкранное поле под GIF ===== */
    .hero{
      height:100dvh;
      position:relative;
      background:linear-gradient(180deg,var(--bg2),var(--bg));
      overflow:hidden;
    }
    .heroMedia{
      position:absolute;
      inset:0;
      background:var(--hero-img);
      background-size:cover;
      background-position:center;
      filter:saturate(1.02) contrast(1.02);
    }
    /* лёгкая "плашка" сверху, чтобы кнопки читались */
    .heroFade{
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 500px at 50% 10%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
        linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
      pointer-events:none;
    }

    /* верхняя панель поверх hero */
    .heroTop{
      position:absolute;
      top:14px; left:14px; right:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:5;
      gap:10px;
    }
    .brandMini{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:linear-gradient(145deg,var(--bg2),var(--bg));
      box-shadow:
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
      user-select:none;
    }
    .brandMini img{
      width:28px;height:28px;object-fit:contain;display:block;
      border-radius:10px;
    }
    .brandMini span{
      font-weight:900;
      color:var(--text2);
      letter-spacing:.2px;
    }

    /* кнопка меню (серый неоморф) */
    .menuBtn{
      border:none;
      border-radius:18px;
      padding:10px 14px;
      font-weight:900;
      background:linear-gradient(145deg,var(--btn1),var(--btn2));
      color:var(--text2);
      cursor:pointer;
      box-shadow:
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .menuBtn:active{
      transform:translateY(1px) scale(.98);
      box-shadow:
        inset 10px 10px 20px rgba(160,170,185,.55),
        inset -10px -10px 20px rgba(255,255,255,.9);
      filter:brightness(.98);
    }
    .menuBtn:focus-visible{
      box-shadow:
        0 0 0 2px rgba(90,100,120,.25),
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
    }

    /* баннер-оверлей на hero (даёт "возможность добавить баннер") */
    .heroBanner{
      position:absolute;
      right:14px;
      top:72px;
      width:min(58%,220px);
      height:72px;
      border-radius:20px;
      background:var(--banner-img), linear-gradient(145deg,var(--bg2),var(--bg));
      background-size:cover;
      background-position:center;
      box-shadow:
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
      display:none; /* включится автоматически, если найдёт banner.* */
      z-index:6;
      text-decoration:none;
    }
    .heroBanner::after{
      content:"Баннер";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:rgba(30,30,30,.75);
      letter-spacing:.3px;
      background:rgba(255,255,255,.25);
      border-radius:20px;
      opacity:.0; /* если картинка есть — надпись прячем */
    }
    .heroBanner.hasImg::after{opacity:0;}

    /* ===== Блок текста под hero ===== */
    .section{
      padding:20px 18px 0;
    }
    .titleBig{
      margin-top:12px;
      text-align:center;
      font-weight:900;
      font-size:clamp(30px,7.5vw,44px);
      letter-spacing:1.2px;
      /* "как в твоём коде, но спокойнее" */
      background:linear-gradient(90deg,#2A2A2A,#9AA3AF,#2A2A2A);
      background-size:200% auto;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation:flow 10s linear infinite;
      text-shadow:0 6px 24px rgba(0,0,0,.06);
    }
    @keyframes flow{
      0%{background-position:0% 50%}
      100%{background-position:200% 50%}
    }
    .lead{
      margin:10px 0 16px;
      font-size:14px;
      color:var(--muted);
      text-align:center;
      line-height:1.35;
    }

    /* ===== Баннер "Работа" (кликабельный, с местом под GIF) ===== */
    .workCard{
      margin:14px 0 16px;
      border-radius:26px;
      background:linear-gradient(145deg,var(--bg2),var(--bg));
      box-shadow:
        12px 12px 26px var(--shadow-dark),
        -12px -12px 26px var(--shadow-light);
      overflow:hidden;
      text-decoration:none;
      color:inherit;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      min-height:150px;
      position:relative;
    }
    .workMedia{
      background:var(--work-img), linear-gradient(145deg,var(--panel),var(--panel2));
      background-size:cover;
      background-position:center;
      position:relative;
    }
    /* надпись поверх гифки "Работа" */
    .workBadge{
      position:absolute;
      left:14px;
      top:14px;
      padding:10px 14px;
      border-radius:18px;
      font-weight:900;
      color:var(--text2);
      background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.45));
      box-shadow:
        10px 10px 20px rgba(0,0,0,.08),
        -10px -10px 20px rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
    }
    .workRight{
      padding:16px 16px 16px 14px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:10px;
    }
    .workTitle{
      font-weight:900;
      font-size:18px;
      color:var(--text2);
    }
    .workDesc{
      font-size:13px;
      color:var(--muted);
      line-height:1.35;
    }
    /* кнопка внутри баннера: высота ~ на 20% меньше стандартной */
    .workBtn{
      align-self:flex-start;
      border:none;            /* обводки нет */
      background:linear-gradient(145deg,var(--btn1),var(--btn2));
      color:var(--text2);
      font-weight:900;
      border-radius:18px;
      height:44px;            /* было бы ~56, сделали меньше */
      padding:0 16px;
      cursor:pointer;
      box-shadow:
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .workBtn:active{
      transform:translateY(1px) scale(.98);
      box-shadow:
        inset 10px 10px 20px rgba(160,170,185,.55),
        inset -10px -10px 20px rgba(255,255,255,.9);
    }

    /* ===== 6 кнопок (2 в ряд) золотой градиент ===== */
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      padding-bottom:22px;
    }
    .goldBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px 12px;
      border-radius:20px;
      text-decoration:none;
      font-weight:900;
      color:var(--text2);
      background:linear-gradient(145deg,var(--gold1),var(--gold2));
      border:none; /* без обводок */
      box-shadow:
        12px 12px 26px rgba(0,0,0,.10),
        -12px -12px 26px rgba(255,255,255,.85);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
    }
    .goldBtn:active{
      transform:translateY(1px) scale(.985);
      box-shadow:
        inset 12px 12px 22px rgba(0,0,0,.12),
        inset -12px -12px 22px rgba(255,255,255,.8);
      filter:brightness(.98);
    }
    @media (hover:hover){
      .goldBtn:hover,.menuBtn:hover,.workBtn:hover,.workCard:hover{
        transform:translateY(-1px);
        box-shadow:
          14px 14px 30px rgba(0,0,0,.12),
          -14px -14px 30px rgba(255,255,255,.9);
      }
    }

    /* футер */
    .foot{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      padding:18px 18px 22px;
    }
    .foot a{
      color:var(--text);
      font-weight:900;
      text-decoration:none;
      opacity:.8;
    }

    /* ===== Шторка меню (обновлённый стиль) ===== */
    .sheetWrap{
      position:fixed;
      inset:0;
      display:none;
      z-index:80;
    }
    .sheetWrap.active{display:block;}
    .sheetShade{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.22);
      backdrop-filter:blur(6px);
    }
    .sheet{
      position:absolute;
      right:0; top:0;
      height:100%;
      width:min(86vw,340px);
      padding:20px 18px;
      border-top-left-radius:26px;
      border-bottom-left-radius:26px;
      background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(245,247,250,.78));
      backdrop-filter: blur(16px);
      box-shadow:-18px 0 38px rgba(0,0,0,.18);
      transform:translateX(100%);
      transition:transform .25s ease-out;
    }
    .sheetWrap.active .sheet{transform:none;}
    .sheet h2{
      color:var(--text2);
      font-weight:900;
      margin-bottom:12px;
      letter-spacing:.2px;
    }
    .sheet a{
      display:block;
      padding:12px 14px;
      margin-bottom:10px;
      border-radius:18px;
      text-decoration:none;
      font-weight:900;
      color:var(--text2);
      background:linear-gradient(145deg,var(--bg2),var(--bg));
      box-shadow:
        10px 10px 22px var(--shadow-dark),
        -10px -10px 22px var(--shadow-light);
    }
    .sheet a:active{
      box-shadow:
        inset 10px 10px 20px rgba(160,170,185,.55),
        inset -10px -10px 20px rgba(255,255,255,.9);
    }

  </style>
</head>

<body>
  <main class="shell">
    <!-- Прелоадер -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div class="loaderText">Загружаем…</div>
    </div>

    <div class="content">

      <!-- HERO (полный экран под GIF) -->
      <section class="hero" id="home">
        <div class="heroMedia" aria-hidden="true"></div>
        <div class="heroFade" aria-hidden="true"></div>

        <div class="heroTop">
          <div class="brandMini">
            <img id="brandLogo" alt="Logo" />
            <span>PEAKY</span>
          </div>
          <button class="menuBtn" id="openMenu">Меню</button>
        </div>

        <!-- Баннер-оверлей (появится если есть banner.*) -->
        <a class="heroBanner" id="heroBanner" href="#" aria-label="Баннер"></a>
      </section>

      <!-- ТЕКСТ ПОД GIF -->
      <section class="section">
        <div class="titleBig">PEAKYCATS</div>
        <p class="lead">магазинчик бла бла бла — покупайте больше цифровых товаров</p>

        <!-- Баннер "Работа" (весь блок — кнопка) -->
        <a class="workCard" href="jobs.html" id="workCard" aria-label="Работа">
          <div class="workMedia">
            <div class="workBadge">Работа</div>
          </div>
          <div class="workRight">
            <div class="workTitle">Работать с нами</div>
            <div class="workDesc">Вакансии, условия и быстрый старт. Нажми и посмотри.</div>
            <button class="workBtn" type="button" aria-hidden="true">Открыть</button>
          </div>
        </a>

        <!-- 6 кнопок (2 в ряд) -->
        <div class="grid" id="links">
          <a class="goldBtn" href="https://t.me/" target="_blank" rel="noopener">Канал</a>
          <a class="goldBtn" href="#" >Чат</a>

          <a class="goldBtn" href="jobs.html">Вакансии</a>
          <a class="goldBtn" href="https://t.me/663studio" target="_blank" rel="noopener">Создатель</a>

          <a class="goldBtn" href="https://t.me/jdjfioa1ucusoangibot" target="_blank" rel="noopener">Бот</a>
          <a class="goldBtn" href="#" >Помощник</a>
        </div>

        <footer class="foot">
          Сделано с 🩶 <a href="https://t.me/663studio" target="_blank" rel="noopener">663studio</a>
        </footer>
      </section>

    </div>
  </main>

  <!-- Шторка меню -->
  <div class="sheetWrap" id="sheet">
    <div class="sheetShade" id="closeSheet"></div>
    <aside class="sheet" role="dialog" aria-label="Меню">
      <h2>Навигация</h2>
      <a href="index.html">Главная</a>
      <a href="jobs.html">Вакансии</a>
      <a href="#" >Чат</a>
      <a href="https://t.me/" target="_blank" rel="noopener">Канал</a>
    </aside>
  </div>

<script>
  /* ======= загрузка ассетов + прелоадер ======= */
  let imgReadyResolve;
  const imgReadyPromise = new Promise(res => { imgReadyResolve = res; });

  const loader = document.getElementById('loader');
  const MIN_LOAD_MS = 600;
  const t0 = Date.now();

  window.addEventListener('load', () => {
    const left = Math.max(0, MIN_LOAD_MS - (Date.now() - t0));
    const timeoutPromise = new Promise(res => setTimeout(res, left));
    Promise.all([timeoutPromise, imgReadyPromise]).then(() => loader.classList.add('hidden'));
  });

  /* без автопрыжков */
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0,0);

  /* меню */
  const open = document.getElementById('openMenu');
  const sheet = document.getElementById('sheet');
  const closeShade = document.getElementById('closeSheet');

  open.onclick = () => sheet.classList.add('active');
  closeShade.onclick = () => sheet.classList.remove('active');
  window.addEventListener('keydown', e => { if(e.key === 'Escape') sheet.classList.remove('active'); });
  document.querySelectorAll('.sheet a').forEach(link => link.addEventListener('click', () => sheet.classList.remove('active')));

  /* автоподстановка изображений */
  (async () => {
    const root = document.documentElement;

    const ok = async (u) => {
      try{
        const r = await fetch(u + '?v=' + Date.now(), { cache:'no-store' });
        return r.ok;
      }catch{ return false; }
    };
    const first = async (list) => {
      for(const p of list){
        if(await ok(p)) return p;
      }
      return null;
    };
    const setVarUrl = (key, url) => root.style.setProperty(key, `url("${url}?v=${Date.now()}")`);

    /* HERO gif (крокодил) */
    const hero = await first([
      'hero.gif','hero.webp','hero.png','hero.jpg',
      'croc.gif','crocodile.gif','krokodil.gif','krokodil.webp'
    ]);
    if(hero) setVarUrl('--hero-img', hero);

    /* баннер-оверлей (опционально) */
    const banner = await first(['banner.webp','banner.png','banner.gif']);
    const heroBanner = document.getElementById('heroBanner');
    if(banner){
      setVarUrl('--banner-img', banner);
      heroBanner.style.display = 'block';
      heroBanner.classList.add('hasImg');
      // ссылку на баннер меняй тут:
      heroBanner.href = '#';
    }

    /* лого в маленькой плашке */
    const brand = await first(['brand.webp','brand.png','brand.gif','brand.jpg','logo.webp','logo.png','logo.gif','logo.jpg']);
    const brandEl = document.getElementById('brandLogo');
    if(brand) brandEl.src = brand + '?v=' + Date.now();
    else brandEl.style.display = 'none';

    /* GIF в баннере "Работа" */
    const work = await first(['work.gif','job.gif','work.webp','work.png','work.jpg']);
    if(work) setVarUrl('--work-img', work);

    if(imgReadyResolve) imgReadyResolve();
  })();
</script>
</body>
</html>
