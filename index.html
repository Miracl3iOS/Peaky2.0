<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROSTIK Ufa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
:root{
  /* ===== NEW: colorful shimmering background palette ===== */
  --bg1:#CBD2E3;
  --bg2:#EFF0F8;
  --bg3:#D4D4DE;
  --bg4:#EDEFFB;
  --bg5:#EAECF8;

  --text:#1C1C1C;
  --muted:rgba(28,28,28,.68);
  --heading:#111318;

  /* platinum neon */
  --neonPlat: rgba(233,237,245,.92);
  --neonPlat2: rgba(201,209,221,.85);

  /* MENU button colors */
  --iceBlue: rgba(215, 242, 255, .92);
  --navy: #0B1A3A;

  /* ==== PLATINUM BUTTONS (как в PeakyCats) ==== */
  --text2:#1C1C1C;

  /* платина для кнопок */
  --plat1:#E9EDF5;
  --plat2:#C9D1DD;
  --plat3:#FFFFFF;

  /* мягкая тень */
  --shadow: 6px 6px 14px rgba(160,170,185,.22),
            -6px -6px 14px rgba(255,255,255,.92);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  /* NEW: animated bright gradient background */
  background:
    radial-gradient(1200px 900px at 10% 10%, var(--bg2), transparent 55%),
    radial-gradient(1000px 800px at 90% 15%, var(--bg5), transparent 60%),
    radial-gradient(900px 700px at 20% 85%, var(--bg1), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, var(--bg4), transparent 62%),
    linear-gradient(120deg, var(--bg3), var(--bg2), var(--bg4), var(--bg1), var(--bg5));
  background-size: 140% 140%;
  animation: bgFlow 12s ease-in-out infinite;

  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
@keyframes bgFlow{
  0%{ background-position: 0% 50%; }
  50%{ background-position: 100% 50%; }
  100%{ background-position: 0% 50%; }
}

a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none}

/* ---------- HERO VIDEO ---------- */
.hero{
  position:relative;
  width:100%;
  /* CHANGED: уменьшили область на 25% */
  height:min(42vh,390px);
  min-height:240px;
  overflow:hidden;
  background:#000; /* если постер не подгрузился */

  /* NEW: platinum neon outline */
  border-radius: 0 0 22px 22px;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:
    0 0 0 1px rgba(233,237,245,.28) inset,
    0 0 18px rgba(233,237,245,.22),
    0 0 36px rgba(201,209,221,.18);
}
.hero::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius: 0 0 18px 18px;
  pointer-events:none;
  box-shadow:
    0 0 0 1px rgba(233,237,245,.22),
    0 0 22px rgba(233,237,245,.30),
    0 0 44px rgba(201,209,221,.22);
  mix-blend-mode:screen;
}
.heroVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none; /* важно: клики проходят */
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.40));
  pointer-events:none;
}

/* MENU BUTTON */
.menuBtn{
  position:absolute;
  top:14px;
  right:14px;
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;

  /* CHANGED: снежно-голубая */
  background: var(--iceBlue);
  backdrop-filter:blur(10px);

  box-shadow:
    0 10px 22px rgba(10,20,40,.12),
    0 0 0 1px rgba(11,26,58,.22) inset;
  z-index:5;
}

/* CHANGED: темно-синие "стрелочки" (бургер линии) */
.menuBtn svg{width:22px;height:22px;color:var(--navy)}
.menuBtn:active{transform:scale(.96)}

/* ---------- CONTENT ---------- */
.wrap{
  width:min(430px,100%);
  margin:0 auto;
  padding:18px 16px 28px;
}

.h1{
  text-align:center;
  font-size:clamp(30px,7vw,44px);
  font-weight:900;
  letter-spacing:1.2px;
  color: rgba(10,12,18,.92);
  text-shadow: 0 10px 24px rgba(10,20,40,.10);
}

.lead{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

/* ---------- WORK BANNER ---------- */
.workBanner{
  position:relative;
  margin-top:18px;
  height:120px;
  border-radius:22px;
  overflow:hidden;
  /* CHANGED: softer, platinum-like */
  box-shadow: var(--shadow);
  background:#000;
  display:block;
  border:1px solid rgba(255,255,255,.28);
}
.workVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}
.workBanner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.45));
  pointer-events:none;
}
.workTitle{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:900;
  letter-spacing:1px;

  /* CHANGED: platinum text (instead of gold) */
  color:transparent;
  background:linear-gradient(90deg,
    #FFFFFF,
    #E9EDF5,
    #C9D1DD,
    #FFFFFF,
    #E9EDF5
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:platFlow 9s linear infinite;
  text-shadow:0 12px 26px rgba(0,0,0,.35);
}
@keyframes platFlow{to{background-position:220% 50%}}

/* ---------- PLATINUM BUTTONS ---------- */
.grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

/* сама кнопка */
.metalBtn{
  position:relative;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  letter-spacing:.6px;
  color:var(--text2);

  background:
    linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,0) 38%),
    linear-gradient(120deg,
      #AEB7C3,
      var(--plat1),
      #E8EDF5,
      var(--plat3),
      var(--plat2),
      #E8EDF5,
      #AEB7C3
    );

  box-shadow:var(--shadow);
  overflow:hidden;
  user-select:none;
  transition:transform .15s ease, filter .15s ease;
}

/* переливание */
.metalBtn::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:linear-gradient(115deg,
    transparent 40%,
    rgba(255,255,255,.55) 50%,
    transparent 60%
  );
  transform:translateX(-50%) rotate(12deg);
  animation:shimmer 3s linear infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}

@keyframes shimmer{
  to{ transform:translateX(50%) rotate(12deg); }
}

.metalBtn:active{
  transform:translateY(1px) scale(.98);
  filter:brightness(.985);
}

/* ---------- MENU SHEET ---------- */
.sheetWrap{
  position:fixed;
  inset:0;
  display:none;
  z-index:1000;
}
.sheetWrap.active{display:block}
.sheetShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
}

/* CHANGED: silver-platinum, keep transparency */
.sheet{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(86vw,340px);
  background: rgba(233,237,245,.22);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  padding:18px;
  transform:translateX(100%);
  transition:transform .22s ease-out;

  border-left: 1px solid rgba(255,255,255,.55);
  box-shadow: -18px 0 50px rgba(10,20,40,.18);
}
.sheetWrap.active .sheet{transform:none}
.sheet h2{color:rgba(10,12,18,.92);font-weight:900;margin:8px 0 14px}

.sheet a{
  display:block;
  padding:14px;
  border-radius:16px;
  background: rgba(255,255,255,.34);
  margin-bottom:12px;
  box-shadow: var(--shadow);
  color: rgba(10,12,18,.88);
}

.foot{
  margin-top:18px;
  text-align:center;
  font-size:12px;
  color:rgba(10,12,18,.58);
}
.foot a{
  color:rgba(10,12,18,.78);
  font-weight:900;
  text-decoration:none;
  border-bottom:1px dashed rgba(90,110,140,.45);
}

/* лёгкий hover только на ПК */
@media (hover:hover){
  .metalBtn:hover{ filter:brightness(.995); }
  .workBanner:hover{ transform:translateY(-1px); }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <video
    class="heroVideo"
    id="heroVideo"
    autoplay
    loop
    muted
    playsinline
    preload="metadata"
    poster="hero.jpg"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noremoteplayback"
  >
    <source src="hero.mp4" type="video/mp4">
  </video>

  <button class="menuBtn" id="openMenu" aria-label="Открыть меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
</section>

<main class="wrap">
  <div class="h1">PROSTIK UFA</div>
  <div class="lead">Получить кайф здесь пиздец как Prosto</div>

  <!-- WORK -->
  <a class="workBanner" href="#" aria-label="Работа">
    <video
      class="workVideo"
      id="workVideo"
      autoplay
      loop
      muted
      playsinline
      preload="metadata"
      poster="work.jpg"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
    >
      <source src="work.mp4" type="video/mp4">
    </video>
    <div class="workTitle">РАБОТА</div>
  </a>

  <!-- BUTTONS -->
  <section class="grid" aria-label="Кнопки">
    <a class="metalBtn" href="#">КАНАЛ</a>
    <a class="metalBtn" href="#">ЧАТ</a>
    <a class="metalBtn" href="#">ВАКАНСИИ</a>
    <a class="metalBtn" href="#">СОЗДАТЕЛЬ</a>
    <a class="metalBtn" href="#">БОТ</a>
    <a class="metalBtn" href="#">ПОМОЩНИК</a>
  </section>

  <footer class="foot">
    Сделано — 🖤 <a href="#">663 design</a>
  </footer>
</main>

<!-- MENU -->
<div class="sheetWrap" id="sheet">
  <div class="sheetShade" id="closeSheet"></div>
  <aside class="sheet" role="dialog" aria-label="Меню">
    <h2>Меню</h2>
    <a href="#">Главная</a>
    <a href="#">Работа</a>
    <a href="#">Контакты</a>
    <a href="#">Вакансии</a>
  </aside>
</div>

<script>
/* ===== MENU ===== */
const sheet = document.getElementById('sheet');
document.getElementById('openMenu').onclick = () => sheet.classList.add('active');
document.getElementById('closeSheet').onclick = () => sheet.classList.remove('active');
window.addEventListener('keydown', (e) => { if(e.key === 'Escape') sheet.classList.remove('active'); });

/* ===== VIDEO AUTOPLAY HARDENING (iOS/Android/PC) ===== */
const vids = [
  document.getElementById('heroVideo'),
  document.getElementById('workVideo')
].filter(Boolean);

function tryPlay(v){
  if(!v) return;
  v.muted = true;
  v.playsInline = true;

  const p = v.play();
  if(p && typeof p.catch === 'function'){
    p.catch(()=>{});
  }
}

function kickAll(){
  vids.forEach(v => tryPlay(v));
}

/* 1) сразу */
kickAll();

/* 2) после готовности страницы */
window.addEventListener('load', kickAll);

/* 3) на первый тап/скролл (часто нужно на Android) */
['touchstart','pointerdown','click','scroll'].forEach(evt=>{
  window.addEventListener(evt, kickAll, { once:true, passive:true });
});

/* 4) когда вкладка возвращается */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) kickAll();
});

/* 5) если видео внезапно остановилось — поднимем */
vids.forEach(v=>{
  v.addEventListener('pause', ()=>{
    if(!document.hidden) tryPlay(v);
  });
});
</script>

</body>
</html>
