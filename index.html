<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ALLIGATORRB</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #2D2A28; /* Темный основной фон */
      --text: #FFFFFF; /* Белый цвет текста */
      --secondary-text: #B0B0B0; /* Светло-серый для второстепенного текста */
      --button-bg: #FFD700; /* Золотой цвет кнопок */
      --button-hover-bg: #FF9900; /* Оранжевый при наведении на кнопки */
      --highlight: linear-gradient(145deg, #d6af00, #f0c700); /* Переливающийся градиент для кнопок */
      --heading: #EAEAEA; /* Светлый серый для заголовков */
      --menu-bg: #4F4A47; /* Темно-серый фон для меню */
      --shadow: 6px 6px 15px rgba(0, 0, 0, 0.2), -6px -6px 15px rgba(255, 255, 255, 0.3); /* Мягкие тени */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    a, button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    a {
      text-decoration: none;
    }

    /* ---------- SNOW EFFECT ---------- */
    @keyframes snow {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

    .snowflake {
      position: absolute;
      top: -10px;
      z-index: 9999;
      pointer-events: none;
      animation: snow 10s linear infinite;
      opacity: 0.6;
      font-size: 16px;
      color: white;
    }

    .snowflake:nth-child(odd) {
      left: 20%;
      animation-duration: 12s;
    }

    .snowflake:nth-child(even) {
      left: 60%;
      animation-duration: 8s;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      width: 100%;
      height: min(56vh, 520px);
      min-height: 320px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.1), -6px -6px 15px rgba(255, 255, 255, 0.2);
    }

    .heroVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    /* ---------- MENU BUTTON ---------- */
    .menuBtn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(26, 20, 17, 0.6);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .menuBtn svg {
      width: 22px;
      height: 22px;
      color: var(--highlight);
    }

    .menuBtn:active {
      transform: scale(0.96);
    }

    /* ---------- CONTENT ---------- */
    .wrap {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    .h1 {
      text-align: center;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 900;
      letter-spacing: 1.2px;
      color: transparent;
      background: var(--highlight);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      animation: goldFlow 10s linear infinite;
    }

    @keyframes goldFlow {
      to {
        background-position: 220% 50%;
      }
    }

    .lead {
      margin-top: 10px;
      text-align: center;
      color: var(--secondary-text);
      font-size: 13px;
      line-height: 1.45;
    }

    /* ---------- BUTTONS ---------- */
    .metalBtn {
      position: relative;
      height: 50px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      background: var(--button-bg);
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .metalBtn:hover {
      background: var(--button-hover-bg);
      box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.2), -6px -6px 15px rgba(255, 255, 255, 0.5);
    }

    .metalBtn:active {
      transform: translateY(2px);
      filter: brightness(0.95);
    }

    /* ---------- GRID LAYOUT ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .grid a {
      text-align: center;
    }

    /* ---------- WORK BANNER ---------- */
    .workBanner {
      position: relative;
      margin-top: 18px;
      height: 120px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--bg);
    }

    .workTitle {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: transparent;
      background: var(--highlight);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      animation: goldFlow 10s linear infinite;
      text-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
    }

    /* ---------- MENU SHEET ---------- */
    .sheetWrap {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 1000;
    }

    .sheetWrap.active {
      display: block;
    }

    .sheetShade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .sheet {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: min(86vw, 340px);
      background: rgba(18, 14, 12, 0.95);
      padding: 18px;
      transform: translateX(100%);
      transition: transform 0.22s ease-out;
    }

    .sheetWrap.active .sheet {
      transform: none;
    }

    .sheet h2 {
      color: var(--heading);
      font-weight: 900;
      margin: 8px 0 14px;
    }

    .sheet a {
      display: block;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    /* FOOTER */
    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: var(--secondary-text);
    }

    .foot a {
      color: var(--text);
      font-weight: 900;
      text-decoration: none;
      border-bottom: 1px dashed rgba(201, 162, 77, 0.55);
    }

    @media (hover:hover) {
      .metalBtn:hover {
        filter: brightness(0.98);
      }

      .workBanner:hover {
        transform: translateY(-1px);
      }
    }
  </style>
</head>

<body>
  <!-- Snowflakes -->
  <div class="snowflake" style="animation-delay: 0s;">❄</div>
  <div class="snowflake" style="animation-delay: 2s;">❄</div>
  <div class="snowflake" style="animation-delay: 4s;">❄</div>
  <div class="snowflake" style="animation-delay: 6s;">❄</div>

  <!-- HERO -->
  <section class="hero">
    <video class="heroVideo" id="heroVideo" autoplay loop muted playsinline preload="metadata" poster="hero.jpg" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback">
      <source src="hero.mp4" type="video/mp4">
    </video>
    <button class="menuBtn" id="openMenu" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </section>

  <main class="wrap">
    <div class="h1">ALLIGATORRB</div>
    <div class="lead">магазинчик бла бла бла — покупайте больше цифровых товаров</div>

    <!-- BUTTONS -->
    <section class="grid" aria-label="Кнопки">
      <a class="metalBtn" href="#">КАНАЛ</a>
      <a class="metalBtn" href="#">ЧАТ</a>
      <a class="metalBtn" href="#">ОТЗЫВЫ</a>
      <a class="metalBtn" href="#">ОПЕРАТОР</a>
      <a class="metalBtn" href="#">РАБОТА</a>
      <a class="metalBtn" href="#">САЙТ</a>
    </section>

    <!-- WORK BANNER -->
    <a class="workBanner" href="#" aria-label="Работа">
      <div class="workTitle">РАБОТА</div>
    </a>

    <footer class="foot">
      Сделано — <a href="#">твоя ссылка</a>
    </footer>
  </main>

  <!-- MENU -->
  <div class="sheetWrap" id="sheet">
    <div class="sheetShade" id="closeSheet"></div>
    <aside class="sheet" role="dialog" aria-label="Меню">
      <h2>Меню</h2>
      <a href="#">Главная</a>
      <a href="#">Работа</a>
      <a href="#">Контакты</a>
      <a href="#">Вакансии</a>
    </aside>
  </div>

  <script>
    /* ===== MENU ===== */
    const sheet = document.getElementById('sheet');
    document.getElementById('openMenu').onclick = () => sheet.classList.add('active');
    document.getElementById('closeSheet').onclick = () => sheet.classList.remove('active');
    window.addEventListener('keydown', (e) => { if(e.key === 'Escape') sheet.classList.remove('active'); });
  </script>
</body>
</html>
