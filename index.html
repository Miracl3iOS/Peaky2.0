<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEAKYCATS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
:root{
  /* Фон */
  --bg:#F4F6F9;
  --bg2:#FFFFFF;

  /* Текст */
  --text:#2A2A2A;
  --text2:#1C1C1C;
  --muted:#A1A1A1;

  /* МЕНЬШЕ теней везде */
  --shadow: 7px 7px 16px rgba(170,180,195,.30), -7px -7px 16px rgba(255,255,255,.88);
  --shadowMenu: none; /* меню без тени */

  /* “Платина/серебро” */
  --plat1:#D3D9E1;
  --plat2:#B0B7C1;
  --plat3:#FFFFFF;
  --plat4:#A2A9B1;

  /* высота hero */
  --heroH:min(40vh, 380px);
  --heroMin:240px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none}

/* ===== Loader (вернул) ===== */
.loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  transition:opacity .35s ease, visibility .35s ease;
}
.loader.hidden{opacity:0; visibility:hidden;}
.spinner{
  width:18px;height:18px;border-radius:999px;
  border:2px solid rgba(160,170,185,.35);
  border-top-color:rgba(70,80,95,.65);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loaderText{font-weight:900;color:var(--text);opacity:.85}

/* Контейнер */
.page{
  width:min(430px,100%);
  margin:0 auto;
  min-height:100dvh;
}

/* ---------- HERO VIDEO (углы НЕ закруглять) ---------- */
.hero{
  position:relative;
  width:100%;
  height:var(--heroH);
  min-height:var(--heroMin);
  overflow:hidden;
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  border-radius:0;               /* ВАЖНО: без скруглений */
  box-shadow:var(--shadow);
}

/* видео */
.heroVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}

/* мягкая дымка поверх */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(900px 360px at 30% 18%, rgba(255,255,255,.62), rgba(255,255,255,0) 62%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.05));
  pointer-events:none;
}

/* MENU BUTTON: без тени вообще */
.menuBtn{
  position:absolute;
  top:14px;
  right:14px;
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(244,246,249,.72);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadowMenu); /* none */
  z-index:5;
  transition:transform .14s ease, filter .14s ease;
  outline:none;
}
.menuBtn svg{width:22px;height:22px;color:rgba(28,28,28,.92)}
.menuBtn:active{transform:scale(.96);filter:brightness(.98)}
.menuBtn:focus-visible{outline:none}

/* ===== ВАЖНО: убираем “невидимую кнопку” =====
   heroBanner изначально скрыт и НЕ кликабелен,
   включится только когда картинка реально загрузилась. */
.heroBanner{
  position:absolute;
  top:14px;
  right:70px;
  height:46px;
  width:min(56%,230px);
  border-radius:16px;
  overflow:hidden;

  /* скрыто до onload */
  display:none;
  pointer-events:none;
  opacity:0;

  z-index:5;
  box-shadow:var(--shadow);
}
.heroBanner.ready{
  display:block;
  pointer-events:auto;
  opacity:1;
}
.heroBannerImg{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.heroBanner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
  pointer-events:none;
}
.heroBanner:focus,
.heroBanner:focus-visible{outline:none}

/* ---------- CONTENT ---------- */
.wrap{
  padding:18px 16px 28px;
}

/* Заголовок */
.h1{
  text-align:center;
  font-size:clamp(30px,7vw,44px);
  font-weight:900;
  letter-spacing:1.2px;
  color:transparent;
  background:linear-gradient(90deg,
    #1c1c1c,
    #7f8a99,
    #1c1c1c,
    #b7c0cc,
    #1c1c1c
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:metalFlow 10s linear infinite;
  text-shadow:0 10px 22px rgba(0,0,0,.05);
}
@keyframes metalFlow{to{background-position:220% 50%}}

.lead{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

/* ---------- WORK BANNER ---------- */
.workBanner{
  position:relative;
  margin-top:18px;
  height:120px;
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  display:block;
}
.workVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}
.workBanner::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(800px 280px at 20% 55%, rgba(255,255,255,.38), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.10));
  pointer-events:none;
}
.workTitle{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:900;
  letter-spacing:1px;
  color:transparent;
  background:linear-gradient(90deg,
    var(--plat3),
    #cfd6df,
    var(--plat3),
    #aeb7c3,
    var(--plat3)
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:metalFlow 10s linear infinite;
  text-shadow:0 10px 22px rgba(0,0,0,.10);
}

/* ---------- PLATINUM BUTTONS ---------- */
.grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.metalBtn{
  position:relative;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  letter-spacing:.6px;
  color:var(--text2);

  background:
    linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,0) 38%),
    linear-gradient(120deg,
      #aeb7c3,
      var(--plat1),
      #e8edf5,
      var(--plat3),
      var(--plat2),
      #e8edf5,
      #aeb7c3
    );

  box-shadow:var(--shadow);
  overflow:hidden;
  user-select:none;
  transition:transform .15s ease, filter .15s ease;
}
.metalBtn::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:linear-gradient(115deg,
    transparent 40%,
    rgba(255,255,255,.55) 50%,
    transparent 60%
  );
  transform:translateX(-50%) rotate(12deg);
  animation:shimmer 3s linear infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}
@keyframes shimmer{to{transform:translateX(50%) rotate(12deg)}}
.metalBtn:active{
  transform:translateY(1px) scale(.98);
  filter:brightness(.985);
}

/* ---------- MENU SHEET ---------- */
.sheetWrap{
  position:fixed;
  inset:0;
  display:none;
  z-index:1000;
}
.sheetWrap.active{display:block}
.sheetShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);
}
.sheet{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(86vw,340px);
  background:rgba(244,246,249,.92);
  padding:18px;
  transform:translateX(100%);
  transition:transform .22s ease-out;
  box-shadow:-18px 0 38px rgba(0,0,0,.18);
  border-top-left-radius:22px;
  border-bottom-left-radius:22px;
}
.sheetWrap.active .sheet{transform:none}
.sheet h2{
  color:var(--text2);
  font-weight:900;
  margin:8px 0 14px;
}
.sheet a{
  display:block;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  margin-bottom:12px;
  box-shadow:var(--shadow);
  color:var(--text2);
  font-weight:800;
}
.sheet a:active{transform:translateY(1px)}

/* footer */
.foot{
  margin-top:18px;
  text-align:center;
  font-size:12px;
  color:rgba(161,161,161,.95);
}
.foot a{
  color:rgba(42,42,42,.9);
  font-weight:900;
  text-decoration:none;
  border-bottom:1px dashed rgba(180,188,202,.95);
}

/* hover */
@media (hover:hover){
  .metalBtn:hover{filter:brightness(.995)}
  .workBanner:hover{transform:translateY(-1px)}
}
</style>
</head>

<body>

<!-- Loader -->
<div class="loader" id="loader" aria-live="polite">
  <div class="spinner"></div>
  <div class="loaderText">Загружаем…</div>
</div>

<div class="page">

  <!-- HERO -->
  <section class="hero">
    <video
      class="heroVideo"
      id="heroVideo"
      autoplay
      loop
      muted
      playsinline
      preload="metadata"
      poster="hero.jpg"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate noremoteplayback"
    >
      <source src="hero.mp4" type="video/mp4">
    </video>

    <!-- баннер (опционально). СКРЫТ пока не загрузится картинка -->
    <a class="heroBanner" href="#" id="heroBanner" aria-label="Баннер">
      <img class="heroBannerImg" id="heroBannerImg" alt="">
    </a>

    <button class="menuBtn" id="openMenu" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </section>

  <main class="wrap">
    <div class="h1">PEAKYCATS</div>
    <div class="lead">магазинчик бла бла бла — покупайте больше цифровых товаров</div>

    <!-- WORK -->
    <a class="workBanner" href="jobs.html" aria-label="Работа">
      <video
        class="workVideo"
        id="workVideo"
        autoplay
        loop
        muted
        playsinline
        preload="metadata"
        poster="work.jpg"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
      >
        <source src="work.mp4" type="video/mp4">
      </video>
      <div class="workTitle">РАБОТА</div>
    </a>

    <!-- BUTTONS -->
    <section class="grid" aria-label="Кнопки">
      <a class="metalBtn" href="https://t.me/" target="_blank" rel="noopener">КАНАЛ</a>
      <a class="metalBtn" href="#">ЧАТ</a>
      <a class="metalBtn" href="jobs.html">ВАКАНСИИ</a>
      <a class="metalBtn" href="https://t.me/663studio" target="_blank" rel="noopener">СОЗДАТЕЛЬ</a>
      <a class="metalBtn" href="https://t.me/jdjfioa1ucusoangibot" target="_blank" rel="noopener">БОТ</a>
      <a class="metalBtn" href="#">ПОМОЩНИК</a>
    </section>

    <footer class="foot">
      Сделано — <a href="https://t.me/663studio" target="_blank" rel="noopener">твоя ссылка</a>
    </footer>
  </main>

</div>

<!-- MENU -->
<div class="sheetWrap" id="sheet">
  <div class="sheetShade" id="closeSheet"></div>
  <aside class="sheet" role="dialog" aria-label="Меню">
    <h2>Меню</h2>
    <a href="#">Главная</a>
    <a href="jobs.html">Работа</a>
    <a href="#">Контакты</a>
    <a href="jobs.html">Вакансии</a>
  </aside>
</div>

<script>
/* ===== Loader control =====
   Ждём минимум 600ms + старт видео/картинки баннера (если есть) */
const loader = document.getElementById('loader');
const MIN_LOAD_MS = 600;
const t0 = Date.now();

let bannerSettled = false;
function hideLoaderWhenReady(){
  const left = Math.max(0, MIN_LOAD_MS - (Date.now() - t0));
  setTimeout(() => loader.classList.add('hidden'), left);
}

window.addEventListener('load', () => {
  // если баннера нет/он уже решил что делать — прячем
  if (bannerSettled) hideLoaderWhenReady();
});

/* ===== MENU ===== */
const sheet = document.getElementById('sheet');
document.getElementById('openMenu').onclick = () => sheet.classList.add('active');
document.getElementById('closeSheet').onclick = () => sheet.classList.remove('active');
window.addEventListener('keydown', (e) => { if(e.key === 'Escape') sheet.classList.remove('active'); });

/* ===== Banner (без fetch, чтобы не было “мигания”) ===== */
(function(){
  const wrap = document.getElementById('heroBanner');
  const img  = document.getElementById('heroBannerImg');
  const list = ['banner.webp','banner.png','banner.gif','Banner.webp','Banner.png','Banner.gif'];

  // по умолчанию скрыто и не кликабельно
  wrap.classList.remove('ready');
  wrap.style.display = 'none';
  wrap.style.pointerEvents = 'none';
  wrap.style.opacity = '0';

  let i = 0;
  function done(){
    bannerSettled = true;
    // после load страницы прячем лоадер
    if (document.readyState === 'complete') hideLoaderWhenReady();
  }
  function tryNext(){
    if(i >= list.length){
      // баннера нет — всё равно “settled”
      wrap.style.display = 'none';
      done();
      return;
    }
    img.src = list[i++] + '?v=' + Date.now();
  }

  img.onload = () => {
    // показываем только когда реально загрузился
    wrap.style.display = 'block';
    wrap.classList.add('ready');
    wrap.style.pointerEvents = 'auto';
    wrap.style.opacity = '1';
    done();
  };
  img.onerror = () => tryNext();

  tryNext();
})();

/* ===== VIDEO AUTOPLAY HARDENING (iOS/Android/PC) ===== */
const vids = [
  document.getElementById('heroVideo'),
  document.getElementById('workVideo')
].filter(Boolean);

function tryPlay(v){
  if(!v) return;
  v.muted = true;
  v.playsInline = true;
  const p = v.play();
  if(p && typeof p.catch === 'function') p.catch(()=>{});
}
function kickAll(){ vids.forEach(tryPlay); }

// стартуем
kickAll();
window.addEventListener('load', kickAll);
['touchstart','pointerdown','click','scroll'].forEach(evt=>{
  window.addEventListener(evt, kickAll, { once:true, passive:true });
});
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) kickAll();
});
vids.forEach(v=>{
  v.addEventListener('pause', ()=>{
    if(!document.hidden) tryPlay(v);
  });
});

// если баннер уже решён, но load ещё не произошёл — на всякий случай прячем лоадер после load
window.addEventListener('load', ()=>{
  if (bannerSettled) hideLoaderWhenReady();
});
</script>

</body>
</html>
