<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PEAKYCATS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #f7689c;
      --ink: #2A2A2A;
      --ink2: #A1A1A1;
      --bg1: #FFFFFF;
      --bg2: #F0F0F0;
      --button-bg: linear-gradient(45deg, #D3D9E1, #B0B7C1);
      --button-shadow: rgba(209, 215, 226, 0.2);
      --gold-gradient: linear-gradient(45deg, #FFD700, #FFEC8B);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Оболочка */
    .shell {
      width: min(100vw, 430px);
      min-height: 100vh;
      background: #fff;
      border-radius: 26px;
      box-shadow: 8px 8px 20px rgba(247, 104, 156, .2), -8px -8px 20px #fff;
      margin: auto;
      position: relative;
      overflow: hidden;
      border: 1px solid #fff;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-bottom: 40px;
    }

    /* Фон */
    .hero {
      background: url('path/to/your-gif.gif') center/cover no-repeat;
      background-size: contain;
      height: 40vh;
      position: relative;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, .7);
    }

    /* Текст PEAKYCATS */
    .title {
      font-size: 3rem;
      font-weight: 800;
      color: var(--ink);
      margin-top: 20px;
    }

    /* Описание */
    .description {
      font-size: 1.2rem;
      color: var(--ink2);
      text-align: center;
      margin: 10px 0;
    }

    /* Баннер с кнопкой "Работа" */
    .banner {
      background: url('path/to/your-image.jpg') center/cover no-repeat;
      height: 20vh;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 900;
      position: relative;
    }

    .banner-button {
      background: var(--gold-gradient);
      border: none;
      padding: 10px 20px;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .banner-button:hover {
      background: linear-gradient(45deg, #FFD700, #FFEC8B);
    }

    /* Кнопки */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      background: var(--button-bg);
      padding: 15px;
      font-size: 1rem;
      text-align: center;
      border-radius: 15px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 4px 8px var(--button-shadow);
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }

    .btn:hover {
      box-shadow: 0 6px 12px var(--button-shadow);
      background: linear-gradient(45deg, #D1D7E2, #A2A9B1);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      font-size: 0.9rem;
      color: var(--ink2);
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="hero">
      <h1>РАБОТА</h1>
    </div>
    <div class="content">
      <div class="title">PEAKYCATS</div>
      <p class="description">Магазинчик бла-бла-бла — покупайте больше цифровых товаров</p>

      <!-- Баннер с кнопкой "Работа" -->
      <div class="banner">
        <button class="banner-button">Работа</button>
      </div>

      <!-- Кнопки -->
      <div class="grid">
        <button class="btn">Канал</button>
        <button class="btn">Чат</button>
        <button class="btn">Вакансии</button>
        <button class="btn">Создатель</button>
        <button class="btn">Бот</button>
        <button class="btn">Помощник</button>
      </div>
    </div>

    <footer class="footer">
      Сделано с 🩷 <a href="https://t.me/663studio">663studio</a>
    </footer>
  </main>
</body>
</html>
