<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Plushy — бело-розовый уютный сайт</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #f7689c;
      --ink: #2a2a2a; 
      --bg1: #f4f6f9;
      --bg2: #e4e4e4;
      --btn-bg: linear-gradient(45deg, #d3d9e1, #b0b7c1);
      --btn-hover: #a2a9b1;
      --btn-text: #1c1c1c;
      --shadow: rgba(209, 215, 226, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg1);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    
    .shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #fff;
      border-radius: 26px;
      box-shadow: 8px 8px 20px rgba(247, 104, 156, .2), -8px -8px 20px #fff;
      margin: auto;
      position: relative;
      overflow: hidden;
      border: 1px solid #fff;
    }

    /* Banner with gif */
    .banner {
      position: relative;
      height: 300px;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('/mnt/data/EC8F600B-1EF3-45EF-B3B7-1249F19CC52D.jpeg'); /* Place your gif URL here */
      background-size: cover;
      background-position: center;
      border-radius: 16px;
    }

    .banner-text {
      position: absolute;
      top: 20px;
      font-weight: 900;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, .5);
    }

    .work-button {
      position: absolute;
      bottom: 20px;
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 10px 20px;
      border-radius: 15px;
      box-shadow: 0px 4px 6px var(--shadow);
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .work-button:hover {
      transform: translateY(-2px);
      box-shadow: 0px 6px 10px var(--shadow);
    }

    /* Main text below the banner */
    .main-text {
      text-align: center;
      font-weight: 900;
      font-size: 2.5rem;
      margin-top: 20px;
      color: var(--ink);
      text-shadow: 0 0 10px rgba(255, 255, 255, .5);
    }

    .sub-text {
      text-align: center;
      font-size: 1rem;
      color: #a1a1a1;
      margin-top: 10px;
    }

    /* Buttons in gold gradient */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
      padding: 0 18px;
    }

    .btn {
      padding: 12px;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(180deg, #ffd700 0%, #ffcc00 100%);
      box-shadow: 0 8px 18px rgba(247, 104, 156, .3), 8px 8px 20px rgba(247, 104, 156, .2), -8px -8px 20px #fff;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: inset 6px 6px 16px rgba(247, 104, 156, .3), inset -6px -6px 16px #fff;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .8), 0 8px 18px rgba(247, 104, 156, .4);
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #a1a1a1;
      padding: 20px;
    }

    footer a {
      color: #a1a1a1;
      font-weight: 900;
      text-decoration: none;
      border-bottom: 1px dashed rgba(154, 74, 105, .6);
    }

    footer a:hover {
      border-bottom-style: solid;
    }

  </style>
</head>
<body>
  <main class="shell">
    <div class="banner">
      <div class="banner-text">РАБОТА</div>
      <button class="work-button">Купить</button>
    </div>

    <div class="main-text">PEAKYCATS</div>
    <div class="sub-text">Магазинчик бла бла бла — покупайте больше цифровых товаров</div>

    <div class="grid">
      <button class="btn">Канал</button>
      <button class="btn">Чат</button>
      <button class="btn">Вакансии</button>
      <button class="btn">Создатель</button>
      <button class="btn">Бот</button>
      <button class="btn">Помощник</button>
    </div>

    <footer>
      Сделано с 🩷 <a href="https://t.me/663studio" target="_blank" rel="noopener">663studio</a>
    </footer>
  </main>
</body>
</html>
